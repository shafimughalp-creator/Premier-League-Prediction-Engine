name: verify-football-data-provider

# Isolated, manual, non-publishing verification for football-data.org v4.
# This workflow MUST NOT synchronize fixtures, write production data, commit,
# push, upload raw API responses, or expose credentials.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-football-data-provider
  cancel-in-progress: false

jobs:
  verify-provider:
    name: Verify football-data.org v4 provider (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository (read-only)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run isolated provider verification
        env:
          FOOTBALL_DATA_ORG_TOKEN: ${{ secrets.FOOTBALL_DATA_ORG_TOKEN }}
          EPL_INTELLIGENCE_TEST_ISOLATED: "1"
        run: |
          python scripts/verify_football_data_provider.py --summary-out "$GITHUB_STEP_SUMMARY"
