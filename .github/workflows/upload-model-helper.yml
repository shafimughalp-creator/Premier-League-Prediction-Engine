name: upload-model-helper

on:
  workflow_dispatch:
    inputs:
      chunk_branch:
        description: "Temporary branch holding model chunks"
        required: true
        type: string

permissions: {}

concurrency:
  group: upload-model-helper
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    # Minimum scope that permits adding an asset to a Release (Release objects
    # live under repository contents). Read is implied. Nothing else granted.
    permissions:
      contents: write
    steps:
      # ---------- env-var input, no shell interpolation ----------
      - name: Validate branch input (hard gate)
        env:
          CHUNK_BRANCH: ${{ inputs.chunk_branch }}
        run: |
          set -euo pipefail
          if [ "$CHUNK_BRANCH" != "tmp/model-upload-v1" ]; then
            echo "::error::Refusing to run: chunk_branch must be exactly 'tmp/model-upload-v1', got '$CHUNK_BRANCH'"
            exit 1
          fi

      # actions/checkout pinned to immutable release SHA
      - name: Checkout chunk branch (tree of main + 21 added files)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.chunk_branch }}
          path: chunks

      # ---------- exact filename set, no extras, no full model ----------
      - name: Validate chunk file set
        working-directory: chunks
        run: |
          set -euo pipefail
          EXPECTED=$(printf 'model.pkl.part%02d\n' $(seq 0 19))
          ACTUAL=$(printf '%s\n' model.pkl.part* 2>/dev/null | sort)
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::chunk file set mismatch (missing, misnamed, or extra):"
            diff <(printf '%s\n' "$EXPECTED") <(printf '%s\n' "$ACTUAL") || true
            exit 1
          fi
          EXTRA=$(printf '%s\n' model.pkl.part* 2>/dev/null | grep -vE '^model\.pkl\.part[0-9]{2}$' || true)
          if [ -n "$EXTRA" ]; then
            echo "::error::unexpected chunk-like files present: $EXTRA"; exit 1
          fi
          if [ -f model.pkl ]; then
            echo "::error::a full model.pkl must never exist on the chunk branch"; exit 1
          fi
          M=$(wc -l < manifest.sha256)
          [ "$M" -eq 20 ] || { echo "::error::manifest has $M lines, expected 20"; exit 1; }
          MNAMES=$(awk '{print $2}' manifest.sha256 | sort)
          if [ "$MNAMES" != "$EXPECTED" ]; then
            echo "::error::manifest entry names do not match the expected chunk set:"
            diff <(printf '%s\n' "$EXPECTED") <(printf '%s\n' "$MNAMES") || true
            exit 1
          fi
          echo "chunk file set validated: exactly 20 parts + manifest"

      # ---------- Layer A: manifest + exact per-chunk sizes ----------
      - name: Layer A - verify manifest and chunk sizes
        working-directory: chunks
        run: |
          set -euo pipefail
          sha256sum -c manifest.sha256
          for f in model.pkl.part00 model.pkl.part01 model.pkl.part02 model.pkl.part03 \
                   model.pkl.part04 model.pkl.part05 model.pkl.part06 model.pkl.part07 \
                   model.pkl.part08 model.pkl.part09 model.pkl.part10 model.pkl.part11 \
                   model.pkl.part12 model.pkl.part13 model.pkl.part14 model.pkl.part15 \
                   model.pkl.part16 model.pkl.part17 model.pkl.part18; do
            S=$(wc -c < "$f")
            [ "$S" -eq 5242880 ] || { echo "::error::$f is $S bytes, expected 5242880"; exit 1; }
          done
          S=$(wc -c < model.pkl.part19)
          [ "$S" -eq 2343018 ] || { echo "::error::model.pkl.part19 is $S bytes, expected 2343018"; exit 1; }
          echo "Layer A passed: 20 chunks, sizes exact, manifest clean"

      # ---------- Layer B: reconstruction in explicit numeric order ----------
      - name: Reconstruct in explicit numeric order
        run: |
          set -euo pipefail
          mkdir -p reconstructed
          cat \
            chunks/model.pkl.part00 chunks/model.pkl.part01 chunks/model.pkl.part02 \
            chunks/model.pkl.part03 chunks/model.pkl.part04 chunks/model.pkl.part05 \
            chunks/model.pkl.part06 chunks/model.pkl.part07 chunks/model.pkl.part08 \
            chunks/model.pkl.part09 chunks/model.pkl.part10 chunks/model.pkl.part11 \
            chunks/model.pkl.part12 chunks/model.pkl.part13 chunks/model.pkl.part14 \
            chunks/model.pkl.part15 chunks/model.pkl.part16 chunks/model.pkl.part17 \
            chunks/model.pkl.part18 chunks/model.pkl.part19 \
            > reconstructed/model.pkl

      - name: Layer B - verify exact byte size and full SHA-256
        run: |
          set -euo pipefail
          B=$(wc -c < reconstructed/model.pkl)
          echo "reconstructed bytes: $B (expect 101957738)"
          [ "$B" -eq 101957738 ] || { echo "::error::byte size mismatch - ABORT, no upload"; exit 1; }
          echo "6824f537f12b0809a3b5cee176ca704e207546eb930a033102e5c1d343bf0202  reconstructed/model.pkl" | sha256sum -c -

      # ---------- Pre-upload Release guard: published, right tag, zero assets ----------
      - name: Confirm Release is published with correct tag and zero assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          R=$(gh api repos/shafimughalp-creator/Premier-League-Prediction-Engine/releases/tags/production-model-v1)
          TAG=$(echo "$R" | jq -r .tag_name)
          DRAFT=$(echo "$R" | jq -r .draft)
          A=$(echo "$R" | jq '.assets | length')
          echo "tag: $TAG | draft: $DRAFT | assets: $A"
          [ "$TAG" = "production-model-v1" ] || { echo "::error::unexpected tag $TAG"; exit 1; }
          [ "$DRAFT" = "false" ]             || { echo "::error::Release is a draft"; exit 1; }
          [ "$A" -eq 0 ]                     || { echo "::error::Release already has $A asset(s) - refusing to overwrite"; exit 1; }

      # ---------- Upload (asset name derives from filename: model.pkl; no --clobber) ----------
      - name: Upload model.pkl to the existing Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload production-model-v1 reconstructed/model.pkl

      # ---------- Layer C: authenticated runner-side verification ----------
      - name: Layer C - verify uploaded asset metadata, then re-download and re-verify
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          N=$(gh api repos/shafimughalp-creator/Premier-League-Prediction-Engine/releases/tags/production-model-v1 --jq '.assets | length')
          [ "$N" -eq 1 ] || { echo "::error::expected exactly 1 asset, found $N - STOP"; exit 1; }
          gh api repos/shafimughalp-creator/Premier-League-Prediction-Engine/releases/tags/production-model-v1 \
            --jq '.assets[] | select(.name=="model.pkl") |
                  if (.size == 101957738) then "asset ok: " + .name + " | " + (.size|tostring) + " bytes | " + .browser_download_url
                  else error("asset size mismatch: " + (.size|tostring)) end'
          mkdir -p downloaded
          gh release download production-model-v1 --pattern 'model.pkl' --dir downloaded
          B=$(wc -c < downloaded/model.pkl)
          [ "$B" -eq 101957738 ] || { echo "::error::downloaded size $B != 101957738 - STOP"; exit 1; }
          echo "6824f537f12b0809a3b5cee176ca704e207546eb930a033102e5c1d343bf0202  downloaded/model.pkl" | sha256sum -c -
          echo "Layer C passed (authenticated context)"
