name: update

on:
  schedule:
    # Every day at 06:15 UTC. Football-data publishes results shortly after
    # the final whistle, so a morning run captures the previous night's games.
    - cron: "15 6 * * *"
  workflow_dispatch:
    inputs:
      retrain:
        description: "Retraining policy"
        required: false
        default: never
        type: choice
        options: [auto, always, never]

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  refresh:
    # Safety gate: this job stays skipped until the approved production model
    # is published as the production-model-v1 release asset and the repository
    # variable MODEL_RELEASE_READY has been set to "true".
    if: vars.MODEL_RELEASE_READY == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download the approved production model
        env:
          MODEL_URL: https://github.com/${{ github.repository }}/releases/download/production-model-v1/model.pkl
          MODEL_SHA256: 6824f537f12b0809a3b5cee176ca704e207546eb930a033102e5c1d343bf0202
        run: |
          mkdir -p artifacts/models
          curl --fail --location --silent --show-error --retry 3 --retry-delay 5 \
               --output artifacts/models/model.pkl "$MODEL_URL" \
            || { echo "::error::Could not download model.pkl from the production-model-v1 release (missing release or asset?)"; exit 1; }
          echo "$MODEL_SHA256  artifacts/models/model.pkl" | sha256sum --check - \
            || { echo "::error::Downloaded model.pkl FAILED SHA-256 verification (expected $MODEL_SHA256) - refusing to continue."; exit 1; }
          ls -l artifacts/models/model.pkl

      - name: Predict with the approved production model
        run: python -m src.pipeline --retrain ${{ github.event.inputs.retrain || 'never' }}

      - name: Rebuild the leakage audit
        run: python -m src.data.validation

      - name: Show the run summary
        run: |
          python - <<'PY'
          import json, pathlib
          state = json.loads(pathlib.Path("data/pipeline_state.json").read_text())
          keys = ("status", "last_success", "n_matches", "data_cutoff",
                  "n_fixtures", "model_version", "test_accuracy", "retrained")
          print(json.dumps({k: state.get(k) for k in keys}, indent=2))
          PY

      - name: Commit refreshed data, reports and predictions
        run: |
          git config user.name  "epl-intelligence-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/processed data/fixtures data/predictions.json \
                  data/predictions data/results data/evaluation \
                  data/pipeline_state.json reports artifacts/metadata
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(data): automated refresh $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-state
          path: |
            data/pipeline_state.json
            reports/evaluation/training_report.json
          if-no-files-found: warn
