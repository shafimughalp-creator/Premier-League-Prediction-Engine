name: sync-fixtures

# Fetches the published EPL fixture schedule and updates
# data/fixtures/upcoming.csv (plus its run metadata) only when something
# actually changed. No model training, no historical rebuild, no predictions:
# the existing `update` workflow scores the synced fixtures on its next run.

on:
  schedule:
    # Daily at 05:45 UTC, ahead of the 06:15 UTC prediction run in update.yml
    # and after openfootball's own ~05:00 UTC daily refresh. GitHub cron is UTC,
    # runs only on the default branch, and may be delayed (sometimes by tens of
    # minutes) during periods of high load.
    - cron: "45 5 * * *"
  workflow_dispatch:

# The job commits the fixture store back to the repository. Nothing else is
# needed: no packages, no issues, no secrets.
permissions:
  contents: write

# Serialise with the prediction workflow so the two never push at once.
concurrency:
  group: update
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Synchronise upcoming fixtures
        # Exits non-zero only when no provider is usable; the existing store is
        # preserved in that case and the job is marked failed.
        run: python -m src.data.fixture_sync --fetch --json

      - name: Write the run summary
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("data/fixtures/sync_state.json")
          if not path.exists():
              print("No sync state was written.")
              raise SystemExit(0)

          run = json.loads(path.read_text(encoding="utf-8")).get("last_run", {})
          counts = run.get("counts", {})
          lines = [
              f"### Fixture sync: {run.get('status', 'unknown')}",
              "",
              f"- Store rows: {run.get('store_rows', 0)}",
              f"- Upcoming (next matchweek): {run.get('upcoming_rows', 0)}",
              f"- New: {counts.get('new', 0)}",
              f"- Updated: {counts.get('updated', 0)}",
              f"- Unchanged: {counts.get('unchanged', 0)}",
              f"- Postponed: {counts.get('postponed', 0)}",
              f"- Cancelled: {counts.get('cancelled', 0)}",
              f"- Completed (dropped): {counts.get('completed', 0)}",
              f"- Retained (absent from feed): {counts.get('retained', 0)}",
              f"- Rejected: {counts.get('rejected', 0)}",
              f"- Store changed: {run.get('store_changed', False)}",
              "",
              "| Source | Status | Rows |",
              "| --- | --- | --- |",
          ]
          for name, block in (run.get("sources") or {}).items():
              lines.append(f"| {name} | {block.get('status')} | {block.get('rows', 0)} |")
          if run.get("error"):
              lines += ["", f"**Error:** {run['error']}"]
          summary = "\n".join(lines)
          print(summary)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
              fh.write(summary + "\n")
          PY

      - name: Commit fixture changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Only a real fixture change justifies a commit. A no-op run still
          # rewrites sync_state.json locally, but that alone is not committed.
          git add data/fixtures/upcoming.csv
          if git diff --cached --quiet; then
            echo "No fixture changes; nothing to commit."
            exit 0
          fi
          git add data/fixtures/sync_state.json
          git commit -m "chore(fixtures): sync upcoming EPL fixtures [skip ci]"
          # Explicit ref keeps the push working even if checkout is detached.
          git push origin "HEAD:${GITHUB_REF_NAME}"
