name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit and leakage tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Download and process data (no training)
        run: python -m src.pipeline --retrain never --predict-only
      - name: Run unit and leakage suites
        run: python -m pytest tests/unit tests/leakage -q

  full:
    name: Train and run the full suite
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Build data and train the production model
        run: python -m src.pipeline --retrain always
      - name: Audit leakage on the full history
        run: python -m src.data.validation
      - name: Run every test (including slow audits)
        run: python -m pytest -o addopts="-q"
