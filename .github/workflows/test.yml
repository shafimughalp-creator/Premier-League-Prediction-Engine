name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit and leakage tests
    # Safety gate: stays skipped until the production-model-v1 release exists
    # and the repository variable MODEL_RELEASE_READY is set to "true".
    if: vars.MODEL_RELEASE_READY == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Download the approved production model
        env:
          MODEL_URL: https://github.com/${{ github.repository }}/releases/download/production-model-v1/model.pkl
          MODEL_SHA256: 6824f537f12b0809a3b5cee176ca704e207546eb930a033102e5c1d343bf0202
        run: |
          mkdir -p artifacts/models
          curl --fail --location --silent --show-error --retry 3 --retry-delay 5 \
               --output artifacts/models/model.pkl "$MODEL_URL" \
            || { echo "::error::Could not download model.pkl from the production-model-v1 release (missing release or asset?)"; exit 1; }
          echo "$MODEL_SHA256  artifacts/models/model.pkl" | sha256sum --check - \
            || { echo "::error::Downloaded model.pkl FAILED SHA-256 verification (expected $MODEL_SHA256) - refusing to continue."; exit 1; }
          ls -l artifacts/models/model.pkl
      - name: Download and process data (no training)
        run: python -m src.pipeline --retrain never --predict-only
      - name: Run unit and leakage suites
        run: python -m pytest tests/unit tests/leakage -q

  full:
    name: Run the full suite with the approved model
    # Safety gate: stays skipped until the production-model-v1 release exists
    # and the repository variable MODEL_RELEASE_READY is set to "true".
    if: vars.MODEL_RELEASE_READY == 'true'
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Download the approved production model
        env:
          MODEL_URL: https://github.com/${{ github.repository }}/releases/download/production-model-v1/model.pkl
          MODEL_SHA256: 6824f537f12b0809a3b5cee176ca704e207546eb930a033102e5c1d343bf0202
        run: |
          mkdir -p artifacts/models
          curl --fail --location --silent --show-error --retry 3 --retry-delay 5 \
               --output artifacts/models/model.pkl "$MODEL_URL" \
            || { echo "::error::Could not download model.pkl from the production-model-v1 release (missing release or asset?)"; exit 1; }
          echo "$MODEL_SHA256  artifacts/models/model.pkl" | sha256sum --check - \
            || { echo "::error::Downloaded model.pkl FAILED SHA-256 verification (expected $MODEL_SHA256) - refusing to continue."; exit 1; }
          ls -l artifacts/models/model.pkl
      - name: Audit leakage on the full history
        run: python -m src.data.validation
      - name: Run every test (including slow audits)
        run: python -m pytest -o addopts="-q"
